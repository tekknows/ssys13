<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register administrator | MINDLOCK</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="light">
    <div class="login-screen">
      <button id="register-theme-toggle" class="icon-button login-theme-toggle" type="button" aria-label="Switch to dark mode">
        <span class="theme-icon">🌙</span>
      </button>
      <main class="login-card">
        <div class="login-brand">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">Administrator access</p>
            <h2>Register administrator</h2>
          </div>
        </div>

        <p class="register-admin-description">
          Create an administrator account. This form is available only to an authenticated administrator.
        </p>

        <form id="register-admin-form" class="login-form" novalidate>
          <label for="register-admin-name">
            Full name
            <input id="register-admin-name" name="name" type="text" autocomplete="name" maxlength="160" required />
          </label>

          <label for="register-admin-email">
            Email address
            <input id="register-admin-email" name="email" type="email" autocomplete="email" maxlength="254" required />
          </label>

          <label for="register-admin-department">
            Department
            <input id="register-admin-department" name="department" type="text" maxlength="120" required />
          </label>

          <label for="register-admin-password">
            Password (at least 8 characters)
            <input id="register-admin-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required />
          </label>

          <label for="register-admin-confirm-password">
            Confirm password
            <input id="register-admin-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required />
          </label>

          <div id="register-admin-message" class="login-error" role="status" aria-live="polite"></div>
          <button id="register-admin-submit" type="submit" class="primary-button full-width">Create administrator</button>
        </form>

        <a class="register-admin-back" href="index.html">Back to dashboard</a>
        <p class="register-admin-bootstrap">
          Creating the first administrator? Use the secure backend <code>npm run provision:admin</code> command.
        </p>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="register-admin.js"></script>
  </body>
</html>
